<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Gonzales Embroidery</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="assets/img/favicon-256.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/portal.css">
</head>
<body class="portal-body">
<header class="site-header scrolled">
  <div class="wrap header-inner">
    <a href="index.html" class="brand"><img src="assets/img/logo-transparent.png" alt="Gonzales Embroidery" class="brand-logo"></a>
    <div class="who"><span>Admin Panel</span><small id="whoEmail"></small></div>
    <button class="btn btn-tag header-cta" id="logoutBtn" type="button">Log Out</button>
  </div>
</header>

<main class="wrap panel" id="app" hidden>
  <div class="tabs bar" id="tabs">
    <button class="tab active" data-view="dash" type="button">Dashboard</button>
    <button class="tab" data-view="orders" type="button">Orders <i class="pill" id="pOrders"></i></button>
    <button class="tab" data-view="clients" type="button">Clients</button>
    <button class="tab" data-view="quotes" type="button">Quote Requests <i class="pill" id="pQuotes"></i></button>
  </div>
  <p class="msg" id="msg" role="alert"></p>
  <section id="v-dash"></section>
  <section id="v-orders" hidden></section>
  <section id="v-clients" hidden></section>
  <section id="v-quotes" hidden></section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <button class="modal-x" id="modalX" type="button" aria-label="Close">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<div class="gate" id="gate" hidden></div>
<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
