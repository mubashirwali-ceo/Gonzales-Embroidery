<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Client Portal — Gonzales Embroidery</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b0b">
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0b0b;--navy:#2b2a6a;--navy2:#201f52;--orange:#f39221;--cream:#f6f1e9;--paper:#fff;--line:#e4dccd;--muted:#7b7467;--red:#d4452f;--green:#1f9d57;--r:10px;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:'Work Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
body.noscroll{overflow:hidden}
a{color:inherit}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.01em;color:var(--navy);line-height:1.1}
.mono,.eyebrow,.tab,th,label.l{font-family:'Space Mono',monospace}
.eyebrow{font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);display:flex;gap:10px;align-items:center}
.eyebrow::before{content:"";width:30px;border-top:1.5px solid var(--orange)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;background:var(--orange);color:var(--ink);padding:12px 22px;font-family:'Space Mono',monospace;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;border-radius:4px;transition:transform .2s var(--ease),box-shadow .2s,background .2s;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(243,146,33,.8)}
.btn:active{transform:none}
.btn.navy{background:var(--navy);color:#fff}
.btn.navy:hover{box-shadow:0 8px 18px -8px rgba(43,42,106,.8)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--orange);box-shadow:none}
.btn.wa{background:#1faa59;color:#fff}
.btn.green{background:#0b8a43;color:#fff}
.btn.danger{background:transparent;border-color:var(--red);color:var(--red)}
.btn.sm{padding:7px 12px;font-size:.7rem}
.btn:disabled{opacity:.5;pointer-events:none}

/* auth */
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.brandp{background:var(--ink);color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.brandp::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 400px at 100% 0,rgba(243,146,33,.25),transparent 60%),radial-gradient(500px 400px at 0 100%,rgba(43,42,106,.9),transparent 60%)}
.brandp>*{position:relative}
.brandp .lgw{display:inline-block;background:var(--cream);padding:8px 14px;border-radius:8px}.brandp img{height:50px}
.brandp h2{color:#fff;font-size:clamp(2.4rem,4.5vw,4rem);margin:18px 0}
.brandp h2 em{color:var(--orange);font-style:normal}
.brandp p{color:#c9c4b8;max-width:46ch}
.perks{list-style:none;display:grid;gap:14px;margin-top:30px}
.perks li{display:flex;gap:14px;align-items:center;font-size:.95rem;opacity:0;transform:translateX(-18px);animation:in .7s var(--ease) forwards}
.perks li:nth-child(2){animation-delay:.15s}.perks li:nth-child(3){animation-delay:.3s}.perks li:nth-child(4){animation-delay:.45s}
.perks b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(243,146,33,.16);color:var(--orange);flex:none}
@keyframes in{to{opacity:1;transform:none}}
.stitchline{width:100%;height:20px;margin-top:40px}
.stitchline path{stroke:var(--orange);stroke-width:3;fill:none;stroke-dasharray:12 9;stroke-dashoffset:900;animation:dash 3s .3s var(--ease) forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.authbox{padding:56px;display:flex;flex-direction:column;justify-content:center;max-width:560px;width:100%;margin:auto}
.authbox h1{font-size:3.6rem;margin:10px 0 24px}
.tabs{display:flex;gap:8px;margin-bottom:22px}
.tab{border:1px solid var(--line);background:var(--paper);padding:11px 18px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;border-radius:3px;transition:.2s}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
form.fm{display:grid;gap:14px}
.fld label,label.l{display:block;font-size:.72rem;font-weight:700;margin-bottom:5px;color:var(--navy);letter-spacing:.04em}
.fld input,.fld select,.fld textarea,.inp{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:6px;background:#fff;font:inherit;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.fld textarea{min-height:86px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus,.inp:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(243,146,33,.2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.msgerr{background:#fdecea;color:#9b2c1d;border:1px solid #f3c1b9;padding:10px 14px;border-radius:6px;font-size:.88rem}
.msgok{background:#e8f6ee;color:#17623a;border:1px solid #bfe4cd;padding:10px 14px;border-radius:6px;font-size:.88rem}
.linkb{background:none;border:0;color:var(--red);text-decoration:underline;font-size:.88rem;text-align:left;padding:0}
.demo{margin-top:22px;padding:14px 16px;border:1px dashed var(--orange);border-radius:8px;font-size:.83rem;background:#fff8ee}
.demo code{font-family:'Space Mono',monospace;background:#fff;padding:1px 6px;border-radius:3px;border:1px solid var(--line)}
.demo button{margin-top:8px}
.fine{color:var(--muted);font-size:.78rem;margin-top:18px}

/* shell */
.ribbon{background:var(--navy2);color:#d9d7f5;font-size:.78rem;padding:7px 16px;text-align:center;display:flex;gap:12px;justify-content:center;align-items:center}
.ribbon button{background:none;border:0;color:#fff;opacity:.7;font-size:1rem}
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:18px;padding:10px 24px;position:sticky;top:0;z-index:30;border-bottom:1px solid #222}
.top .lg{background:var(--cream);padding:4px 10px;border-radius:6px;display:flex}.top img{height:34px}
.top .role{font-family:'Space Mono',monospace;font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--orange);border:1px dashed var(--orange);padding:4px 10px;border-radius:3px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:12px;font-size:.88rem}
.av{width:34px;height:34px;border-radius:50%;background:var(--orange);color:var(--ink);display:grid;place-items:center;font-weight:700}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 62px)}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
.side a{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:6px;text-decoration:none;font-size:.92rem;font-weight:500;color:#3b372f;margin-bottom:4px;transition:.2s;position:relative}
.side a i{font-style:normal;width:22px;text-align:center}
.side a:hover{background:#f3ede1}
.side a.on{background:var(--navy);color:#fff}
.side a .bd{margin-left:auto;background:var(--orange);color:var(--ink);font-size:.68rem;font-weight:700;padding:1px 8px;border-radius:99px}
main{padding:30px clamp(16px,3vw,44px) 70px;max-width:1300px;width:100%;min-width:0}
.cols>*,.grid2>*,.shell>*{min-width:0}
.view{animation:vin .5s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(14px)}}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:24px}
.head h1{font-size:clamp(2rem,4vw,3rem)}
.head p{color:var(--muted)}

/* tiles & cards */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:28px}
.tiles.s8{grid-template-columns:repeat(4,1fr)}
.tiles.s8.sm{grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:22px}
.tile{background:var(--ink);color:#fff;padding:20px 22px;border-radius:4px;position:relative;overflow:hidden;transition:transform .3s var(--ease)}
.tile:hover{transform:translateY(-4px)}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:rgba(243,146,33,.1)}
.tile small{font-family:'Space Mono',monospace;letter-spacing:.12em;text-transform:uppercase;font-size:.66rem;color:#bdb7a8;display:block;line-height:1.35}
.tile b{font-family:Anton,sans-serif;font-weight:400;font-size:2.5rem;line-height:1.2;display:block;margin-top:8px}
.tile.or b{color:var(--orange)}.tile.gr b{color:#4be08a}
.tiles.sm .tile{padding:12px 12px 10px}.tiles.sm .tile small{font-size:.56rem;letter-spacing:.08em;min-height:2.6em}.tiles.sm .tile b{font-size:1.55rem;margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:22px}
.card h2{font-size:1.7rem;margin-bottom:14px}
.card h3{font-size:1.3rem;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:22px}
.hpill{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;padding:6px 14px;border-radius:99px;background:#fff;border:1px solid var(--line)}
.hpill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.hpill.on i{background:var(--green);box-shadow:0 0 0 0 rgba(31,157,87,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(31,157,87,0)}}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.tw.tall{max-height:66vh;overflow:auto}
.tw.tall th{position:sticky;top:0;z-index:2}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:760px}
table.xl{min-width:900px}
th{background:var(--ink);color:#e9e3d6;text-align:left;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;padding:13px 14px;white-space:nowrap}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--orange)}
th .ar{opacity:.4;margin-left:6px;font-size:.62rem}
th.on .ar{opacity:1;color:var(--orange)}
td{padding:11px 14px;border-top:1px solid #eee7d9;vertical-align:middle}
table.xl td{white-space:nowrap}
table.xl td.job{white-space:normal;min-width:170px}
tbody tr{transition:background .15s;cursor:pointer}
tbody tr:hover{background:#fbf6ec}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
a.xlink{color:#1a5fd0;text-decoration:underline}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:Anton;font-weight:400;font-size:1.5rem;color:var(--navy);margin-bottom:6px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.bar .inp{max-width:300px}
.bar select.inp{max-width:170px}
.bar input[type=date].inp{max-width:160px}
.cnt{color:var(--muted);font-size:.86rem}
.sp1{flex:1}
.more{padding:14px;text-align:center;background:#fbf6ec}

/* status chips (same colours as the Excel sheet) */
.bg{display:inline-block;font-family:'Space Mono',monospace;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.s-Paid{background:#0b8a43;color:#fff}
.s-Pending{background:#d32f2f;color:#fff}
.s-Quote{background:#ffe600;color:#111}
.g-Received,.q-New{background:#e8eefc;color:#2450a8}
.g-Design,.g-Digitizing{background:#f0e8fb;color:#6a3aa8}
.g-InProduction,.g-QualityCheck,.q-Replied{background:#fff0dc;color:#a8620f}
.g-Ready{background:#e1f5f1;color:#0d6e5d}
.g-Delivered,.q-Converted{background:#e2f4e9;color:#17623a}
.q-Closed{background:#eee;color:#666}
select.stsel{font:700 .76rem 'Space Mono',monospace;letter-spacing:.04em;text-transform:uppercase;border:0;border-radius:4px;padding:6px 8px;cursor:pointer;min-width:104px;text-align:center}
select.stsel.s-Paid{background:#0b8a43;color:#fff}
select.stsel.s-Pending{background:#d32f2f;color:#fff}
select.stsel.s-Quote{background:#ffe600;color:#111}
select.stsel option{background:#fff;color:#111}
.pos{color:var(--green)}.neg{color:var(--red)}

/* tracker */
.trk{position:relative;padding:8px 0 4px;margin:6px 0}
.trk .line{position:absolute;left:calc(100%/14);right:calc(100%/14);top:25px;height:0;border-top:2px dashed #d9cfbd}
.trk .line i{position:absolute;left:0;top:-2px;height:0;border-top:2px solid var(--orange);width:var(--p);animation:grow 1.5s .2s var(--ease) backwards}
@keyframes grow{from{width:0}}
.trk ol{list-style:none;display:grid;grid-template-columns:repeat(7,1fr);position:relative}
.trk li{text-align:center;font-size:.7rem;color:var(--muted);font-weight:600}
.trk li b{display:grid;place-items:center;width:34px;height:34px;margin:0 auto 8px;border-radius:50%;background:#fff;border:2px solid #d9cfbd;font-family:'Space Mono',monospace;font-size:.78rem;transition:.3s}
.trk li.done b{background:var(--orange);border-color:var(--orange);color:var(--ink)}
.trk li.now b{background:var(--navy);border-color:var(--navy);color:#fff;animation:ring 2s infinite}
.trk li.now,.trk li.done{color:var(--ink)}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(43,42,106,.45)}80%,100%{box-shadow:0 0 0 12px rgba(43,42,106,0)}}
.hint{background:#fff8ee;border-left:4px solid var(--orange);padding:12px 16px;border-radius:0 6px 6px 0;font-size:.9rem;margin-top:12px}

/* chart */
.chart{display:flex;align-items:flex-end;gap:16px;height:190px;padding:10px 4px 0;border-bottom:2px solid var(--ink)}
.chart .m{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chart .bars{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.chart .bars i{width:min(26px,40%);background:var(--navy);border-radius:3px 3px 0 0;animation:up .9s var(--ease) backwards;position:relative}
.chart .bars i+i{background:#0b8a43}
@keyframes up{from{height:0!important}}
.legend{display:flex;gap:18px;font-size:.78rem;margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--navy);margin-right:6px}
.legend span+span::before{background:#0b8a43}
.xl2{display:flex;gap:16px;padding-top:6px;font-size:.7rem;color:var(--muted);font-family:'Space Mono',monospace}
.xl2 span{flex:1;text-align:center}

/* guide */
.rates{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.rate{background:#fff;border:1px solid var(--line);border-left:4px solid var(--orange);padding:20px;border-radius:4px}
.rate:nth-child(2){border-left-color:var(--red)}
.rate small{font-family:'Space Mono',monospace;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.rate h3{font-family:'Work Sans';font-weight:700;font-size:1.15rem;margin:4px 0 2px}
.rate p{font-size:.82rem;color:var(--muted);margin-bottom:12px}
.rate .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:.9rem}
.rate .row:first-of-type{border-top:0}
.rate .row b{font-family:Anton;font-weight:400;font-size:1.5rem;color:var(--ink)}
.dl{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px dashed var(--line);font-size:.9rem}
.dl:first-of-type{border-top:0}
.dl small{display:block;color:var(--muted);font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase}
.dl b{white-space:nowrap}
.band{background:var(--navy);color:#fff;border-radius:6px;padding:24px 28px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin:22px 0}
.band h3{color:#fff;font-family:'Work Sans';font-weight:700;font-size:1.1rem}
.band p{color:#cfcdf0;font-size:.9rem;max-width:56ch}
.est{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:end}
.estout{font-family:Anton;font-size:2rem;color:var(--navy);margin-top:10px}
ol.how{list-style:none;counter-reset:s;display:grid;gap:12px;margin:4px 0 0}
ol.how li{counter-increment:s;position:relative;padding:2px 0 2px 46px;font-size:.95rem}
ol.how li::before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:'Space Mono',monospace;font-weight:700;font-size:.82rem}
code.f{font-family:'Space Mono',monospace;background:#f3ede1;padding:2px 7px;border-radius:4px;font-size:.74rem;word-break:break-word;display:inline-block}
.legendrow{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 2px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(11,11,11,.62);backdrop-filter:blur(3px);z-index:80;display:none;justify-content:flex-end}
#modal.open{display:flex;animation:fd .25s}
@keyframes fd{from{opacity:0}}
.mbox{background:var(--cream);width:min(760px,100%);height:100%;overflow:auto;padding:30px 30px 50px;position:relative;animation:slide .4s var(--ease)}
.mbox.ctr{margin:auto;height:auto;max-height:92vh;border-radius:12px;width:min(580px,94vw);animation:pop .3s var(--ease)}
#modal.c{justify-content:center;align-items:center}
@keyframes slide{from{transform:translateX(60px);opacity:0}}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.mx{position:absolute;right:16px;top:14px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1rem;z-index:2}
.mx:hover{background:var(--orange)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0}
.dgrid div{background:#fff;border:1px solid var(--line);padding:12px 14px;border-radius:6px}
.dgrid small{display:block;font-family:'Space Mono',monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dgrid b{font-size:1.05rem}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gal figure{position:relative;border-radius:6px;overflow:hidden;background:#000;aspect-ratio:1;cursor:zoom-in}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease)}
.gal figure:hover img{transform:scale(1.08)}
.gal .rm{position:absolute;right:6px;top:6px;background:rgba(0,0,0,.7);color:#fff;border:0;width:26px;height:26px;border-radius:50%}
.vid{margin:10px 0;border-radius:8px;overflow:hidden;background:#000}
.vid iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.vid a{display:block;padding:12px 16px;color:#fff;background:var(--navy)}
.chat{display:grid;gap:8px;max-height:280px;overflow:auto;padding:4px;margin-bottom:10px}
.bub{max-width:82%;padding:9px 13px;border-radius:12px;font-size:.9rem;background:#fff;border:1px solid var(--line)}
.bub small{display:block;color:var(--muted);font-size:.68rem;margin-top:3px}
.bub.me{margin-left:auto;background:var(--navy);color:#fff;border-color:var(--navy)}
.bub.me small{color:#bcbbe6}
.bub.sys{margin:auto;background:transparent;border:0;font-size:.76rem;color:var(--muted);text-align:center;font-family:'Space Mono',monospace}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row2 .inp{flex:1;min-width:140px}
.drop{border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--muted);font-size:.86rem;cursor:pointer;transition:.2s;background:#fff}
.drop:hover{border-color:var(--orange);color:var(--ink)}
.thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.log{background:var(--ink);color:#b7f0c8;font-family:'Space Mono',monospace;font-size:.8rem;padding:16px 18px;border-radius:6px;white-space:pre-wrap;min-height:90px;max-height:320px;overflow:auto}
#toast{position:fixed;left:50%;bottom:26px;translate:-50% 140px;background:var(--ink);color:#fff;padding:13px 22px;border-radius:6px;z-index:120;transition:translate .45s var(--ease);box-shadow:0 14px 40px -10px #000;max-width:92vw;font-size:.9rem;border-left:4px solid var(--orange)}
#toast.show{translate:-50% 0}#toast.err{border-left-color:var(--red)}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:130;display:none;place-items:center;padding:20px}
#lb.open{display:grid}#lb img{max-width:94vw;max-height:90vh;border-radius:8px}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:140;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
#printArea{display:none}

@media (max-width:1100px){.tiles.s8.sm{grid-template-columns:repeat(4,1fr)}}
@media (max-width:900px){
 .auth{grid-template-columns:1fr}.brandp{padding:30px 24px}.brandp h2{font-size:2.3rem}.perks{display:none}.authbox{padding:32px 22px}
 .shell{grid-template-columns:1fr}
 .side{position:static;height:auto;display:flex;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);gap:4px;top:auto}
 .side a{white-space:nowrap;margin:0;padding:9px 14px}
 .grid2,.cols{grid-template-columns:1fr}
 .who span.nm{display:none}
 .trk{overflow-x:auto}.trk ol{grid-template-columns:repeat(7,minmax(62px,1fr))}
 .trk .line{left:31px;right:31px}
 .est{grid-template-columns:1fr}
 .mbox{padding:24px 18px 44px}
 .tiles.s8{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:520px){.tiles.s8.sm{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media print{
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important;padding:30px;font-family:'Work Sans',sans-serif;color:#000}
 #printArea table{min-width:0;width:100%;font-size:12px}
 #printArea th{background:#eee!important;color:#000!important;position:static}
 #printArea td,#printArea th{padding:7px 8px;border-bottom:1px solid #ccc;text-align:left}
 #printArea .num{text-align:right}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* ───────── SHA-256 (sync) ───────── */
var sha256=(function(){
 var K=[],H=[],n=2;
 function isP(x){for(var i=2;i*i<=x;i++)if(x%i===0)return false;return true}
 while(K.length<64){if(isP(n)){if(H.length<8)H.push((Math.pow(n,.5)%1)*4294967296|0);K.push((Math.pow(n,1/3)%1)*4294967296|0)}n++}
 return function(msg){
  var bytes=new TextEncoder().encode(msg),l=bytes.length,nb=((l+9+63)>>6)<<6;
  var buf=new Uint8Array(nb);buf.set(bytes);buf[l]=0x80;
  var dv=new DataView(buf.buffer);dv.setUint32(nb-4,(l*8)>>>0);dv.setUint32(nb-8,Math.floor(l*8/4294967296));
  var h=H.slice(),w=new Int32Array(64);
  for(var o=0;o<nb;o+=64){
   for(var i=0;i<16;i++)w[i]=dv.getInt32(o+i*4);
   for(i=16;i<64;i++){
    var a1=w[i-15],b1=w[i-2];
    var s0=((a1>>>7)|(a1<<25))^((a1>>>18)|(a1<<14))^(a1>>>3);
    var s1=((b1>>>17)|(b1<<15))^((b1>>>19)|(b1<<13))^(b1>>>10);
    w[i]=(w[i-16]+s0+w[i-7]+s1)|0;
   }
   var a=h[0],b=h[1],c=h[2],d=h[3],e=h[4],f=h[5],g=h[6],hh=h[7];
   for(i=0;i<64;i++){
    var S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
    var ch=(e&f)^(~e&g);
    var t1=(hh+S1+ch+K[i]+w[i])|0;
    var S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
    var mj=(a&b)^(a&c)^(b&c);
    var t2=(S0+mj)|0;
    hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;
   }
   h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;
  }
  return h.map(function(x){return (x>>>0).toString(16).padStart(8,"0")}).join("");
 };
})();

/* ── the Excel summary formulas, as code ── */
function summary(list){
 var s={digi:0,vec:0,quotes:0,rev:0,paid:0,pending:0,paidRev:0,pendRev:0};
 list.forEach(function(o){
  var t=lc(o.type),st=lc(o.status),p=typeof o.price==="number"?o.price:0;     /* SUM ignores text such as "Free" */
  if(DIGI.some(function(x){return lc(x)===t}))s.digi++;                       /* COUNTIFS Front Chest + Left Chest + Cap + Jacket Back */
  if(t==="vector")s.vec++;                                                    /* COUNTIF "Vector" */
  if(st==="quote")s.quotes++;                                                 /* COUNTIF "Quote" */
  s.rev+=p;                                                                   /* SUM of all prices */
  if(st==="paid"){s.paid++;s.paidRev+=p}                                      /* COUNTIF / SUMIF "Paid" */
  if(st==="pending"){s.pending++;s.pendRev+=p}                                /* COUNTIF / SUMIF "Pending" */
 });
 s.rev=r2(s.rev);s.paidRev=r2(s.paidRev);s.pendRev=r2(s.pendRev);
 return s;
}
function clientStats(c){var l=db.orders.filter(function(o){return o.clientId===c.id}),s=summary(l);s.count=l.length;return s}

function chicagoOpen(){
 try{
  var p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Chicago",weekday:"short",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date()),o={};
  p.forEach(function(x){o[x.type]=x.value});
  var mins=(parseInt(o.hour,10)%24)*60+parseInt(o.minute,10),wk=["Sat","Sun"].indexOf(o.weekday)<0;
  return mins>=(wk?10*60+30:14*60)&&mins<21*60;
 }catch(e){return false}
}
function compress(file,max){
 return new Promise(function(res,rej){
  var r=new FileReader();r.onerror=rej;
  r.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
   var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");
   c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
   res(c.toDataURL("image/jpeg",.72));
  };im.src=r.result};
  r.readAsDataURL(file);
 });
}

var pending=null;
function log(t,add){var l=$("#implog");if(l)l.textContent=add?l.textContent+"\n"+t:t}
function loadXLSX(){return new Promise(function(res,rej){if(window.XLSX)return res();var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=res;s.onerror=function(){rej(new Error("Could not load the Excel reader — check your internet connection."))};document.head.appendChild(s)})}
function nh(h){return String(h==null?"":h).toLowerCase().replace(/[^a-z0-9]/g,"")}
var HDR={no:["ordernumber","orderno","orderid","jobno","invoiceno"],email:["email","emailaddress","clientemail"],client:["clientname","customername","client","customer","name"],job:["joblogoname","jobname","job","jobdescription","design"],date:["date","orderdate"],price:["price","amount","total","cost"],type:["jblccap","type","jobtype"],status:["orderstatus","status"],cust:["customerid","clientid","custid"],phone:["phonewhatsapp","phone","whatsapp","mobile","cell","telephone"],address:["address"],work:["work","business"]};
function parseSheet(aoa){
 for(var r=0;r<Math.min(aoa.length,60);r++){
  var H=(aoa[r]||[]).map(nh),map={};
  Object.keys(HDR).forEach(function(k){for(var i=0;i<HDR[k].length;i++){var ix=H.indexOf(HDR[k][i]);if(ix>-1){map[k]=ix;return}}});
  if(map.client!=null&&(map.status!=null||map.type!=null||map.no!=null))return {kind:"orders",map:map,hr:r,rows:aoa.slice(r+1)};
  if(map.client!=null&&(map.email!=null||map.phone!=null)&&map.job==null&&map.price==null&&map.status==null&&map.type==null)return {kind:"clients",map:map,hr:r,rows:aoa.slice(r+1)};
 }
 return {kind:"none"};
}
function toISO(v,dmy){
 if(v==null||v==="")return "";
 if(v instanceof Date&&!isNaN(v)){var d=new Date(v.getTime()+12*36e5);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}   /* +12h so a few seconds of rounding never changes the day */
 var s=String(v).trim(),m;
 if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
 if(m=s.match(/^(\d{1,2})[\s\-\/]([A-Za-z]{3,9})[\s\-\/,]*(\d{2,4})$/)){var mi=MON.indexOf(m[2].slice(0,1).toUpperCase()+m[2].slice(1,3).toLowerCase()),y=+m[3];if(mi>-1){if(y<100)y+=2000;return y+"-"+pad(mi+1)+"-"+pad(+m[1])}}
 if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)){var a=+m[1],b=+m[2],y2=+m[3];if(y2<100)y2+=2000;var mo=dmy?b:a,da=dmy?a:b;if(mo>12){var t=mo;mo=da;da=t}return y2+"-"+pad(mo)+"-"+pad(da)}
 var p=new Date(s);return isNaN(p)?"":iso(p);
}
function normType(v){
 var s=lc(v).replace(/[^a-z]/g,"");if(!s)return "";
 if(s==="cap"||s==="caps"||s==="hat")return "Cap";
 if(s==="lc"||s==="leftchest")return "Left Chest";
 if(s==="fc"||s==="frontchest")return "Front Chest";
 if(s==="jb"||s==="jacketback")return "Jacket Back";
 if(s==="vector"||s==="vec")return "Vector";
 return String(v).trim();
}
function normStat(v){var s=lc(v);if(/unpaid|pend|due/.test(s))return "Pending";if(/quote/.test(s))return "Quote";if(/paid|complete/.test(s))return "Paid";return "Pending"}
function ckey(o){return [o.clientId,o.date,lc(o.job),typeof o.price==="number"?o.price:"free",lc(o.type)].join("|")}
function cellv(x,k){if(x.m[k]==null)return "";var v=x.r[x.m[k]];return v==null?"":v}
function usableRow(x){
 var n=String(cellv(x,"client")).trim(),e=String(cellv(x,"email")).trim();
 if(!n&&!e)return false;
 return nh(n)!=="clientname";                                                  /* repeated header rows */
}
function readFiles(files){
 log("Reading "+files.length+" file(s)...");
 $("#impf").textContent=Array.prototype.map.call(files,function(f){return f.name}).join(", ");
 loadXLSX().then(function(){
  return Promise.all(Array.prototype.map.call(files,function(f){return f.arrayBuffer().then(function(b){return {name:f.name,wb:XLSX.read(b,{type:"array",cellDates:true})}})}));
 }).then(function(res){
  var cl=[],or=[],out=[],names={no:"Order Number",email:"Email",client:"Client Name",job:"Job/Logo Name",date:"Date",price:"Price",type:"JB/LC/Cap",status:"Order Status",cust:"Customer ID"};
  res.forEach(function(r){r.wb.SheetNames.forEach(function(sn){
   var aoa=XLSX.utils.sheet_to_json(r.wb.Sheets[sn],{header:1,defval:"",raw:true,blankrows:false}),p=parseSheet(aoa),tag=r.name+" ["+sn+"]";
   if(p.kind==="orders"){var rows=p.rows.map(function(x){return {r:x,m:p.map}}).filter(usableRow);or=or.concat(rows);out.push("✔ "+tag+": "+rows.length+" order row(s) — header found on row "+(p.hr+1)+" — columns: "+Object.keys(p.map).filter(function(k){return names[k]}).map(function(k){return names[k]}).join(", "))}
   else if(p.kind==="clients"){var rows2=p.rows.map(function(x){return {r:x,m:p.map}}).filter(usableRow);cl=cl.concat(rows2);out.push("✔ "+tag+": "+rows2.length+" client row(s)")}
   else out.push("– "+tag+": skipped (not an order or client list)");
  })});
  pending={cl:cl,or:or};
  log(out.join("\n")+"\n\nReady: "+or.length+" order row(s), "+cl.length+" client row(s).\nPress “Import everything” to save.");

function runImport(){
 if(!pending)return;var dmy=$("#impd").value==="dmy",addC=0,updC=0,addO=0,skO=0,renum=0,autoC=0,badSt=0,noDate=0;
 function findClient(email,name){var e=lc(email),n=lc(name);return db.users.filter(function(u){return u.role==="client"&&((e&&lc(u.email)===e)||(!e&&n&&lc(u.name)===n))})[0]||null}
 function cidFree(n){return n>0&&!db.users.some(function(u){return u.cid===n})}

  db.users.push(u);return u;
 }
 pending.cl.forEach(function(x){
  var name=String(cellv(x,"client")).trim(),email=String(cellv(x,"email")).trim(),c=findClient(email,name);
  if(c){c.phone=c.phone||String(cellv(x,"phone")||"");c.address=c.address||String(cellv(x,"address")||"");c.work=c.work||String(cellv(x,"work")||"");updC++}
  else{makeClient(name,email,x);addC++}
 });
 var byNo={},ck={};db.orders.forEach(function(o){byNo[o.no]=ckey(o);ck[ckey(o)]=1});
 pending.or.forEach(function(x){
  var name=String(cellv(x,"client")).trim(),email=String(cellv(x,"email")).trim(),c=findClient(email,name);
  if(!c){c=makeClient(name,email,x);autoC++}

 if(k==="video"&&o){o.videos.push($("#vd-u").value.trim());commit();openOrder(o.id);return}
 if(k==="stmt"){statement(f.getAttribute("data-id"),$("#st-f").value,$("#st-t").value);return}
 if(k==="orderform"){
  var oid=f.getAttribute("data-id"),cv=$("#of-c").value,cl;
  if(!cv)return toast("Please choose a client.","err");
  if(cv==="__new__"){
   var nn=$("#of-nn").value.trim(),ne=lc($("#of-ne").value);
   if(!nn||!ne)return toast("Enter the new client's name and email.","err");
   cl=db.users.filter(function(u){return lc(u.email)===ne})[0];
   if(!cl){cl=mkUser({name:nn,email:ne,phone:$("#of-np").value.trim(),cid:nextCid()});db.users.push(cl)}
  }else cl=user(cv);
  var pr=$("#of-p").value.trim(),stt=$("#of-st").value;
  if(pr===""&&stt!=="Quote")return toast("Enter a price (or set the status to Quote for Free).","err");
  var od=oid?order(oid):mkOrder({no:nextNo()}),prev=od.status;
  od.clientId=cl.id;od.job=$("#of-j").value.trim();od.date=$("#of-d").value;od.type=$("#of-t").value;od.price=pr===""?null:Math.max(0,r2(num(pr)));od.status=stt;od.notes=$("#of-n").value.trim();
  if(!oid){od.messages.push({from:"system",text:"Order created",at:Date.now()});if(stt==="Quote")od.stage="Received";db.orders.push(od);var qid=f.getAttribute("data-q");if(qid){var qx=db.quotes.filter(function(x){return x.id===qid})[0];if(qx)qx.status="Converted"}}
  else if(prev!==stt)od.messages.push({from:"system",text:"Order status changed to "+stt,at:Date.now()});
  save();dirty=false;render();openOrder(od.id);toast("Order #"+od.no+" saved.");return;
 }
 if(k==="clientform"){
  var cid=f.getAttribute("data-id"),em2=lc($("#cf-e").value),dup=db.users.filter(function(u){return lc(u.email)===em2&&u.id!==cid})[0];
  if(dup)return toast("Another client already uses that email.","err");
  var cc=cid?user(cid):mkUser({cid:nextCid()});cc.name=$("#cf-n").value.trim();cc.email=em2;cc.phone=$("#cf-p").value.trim();cc.address=$("#cf-a").value.trim();cc.work=$("#cf-w").value.trim();
  var pw=cid&&$("#cf-pw")?$("#cf-pw").value:"";if(pw){if(pw.length<6)return toast("Password must be 6+ characters.","err");setPw(cc,pw)}
  if(!cid)db.users.push(cc);save();dirty=false;render();openClient(cc.id);toast("Client saved ("+custId(cc)+").");return;
 }
});
document.addEventListener("change",function(e){
 var t=e.target,k=t.getAttribute&&t.getAttribute("data-change");
 if(k==="ofilter")applyOrderFilter(true);
 if(k==="est")estUpdate();
 if(k==="rowstatus"){
  var ro=order(t.getAttribute("data-id"));
  if(ro&&ro.status!==t.value){ro.status=t.value;t.className="stsel s-"+ro.status;ro.messages.push({from:"system",text:"Order status changed to "+ro.status,at:Date.now()});
   if(save()){toast("Order #"+ro.no+" → "+ro.status);var ss=$("#sumstrip");if(ss)ss.innerHTML=sumHTML(summary(db.orders),true,true);if($("#os")&&$("#os").value)applyOrderFilter()}}
 }
 if(k==="status"&&curOrder){var o=order(curOrder);if(o&&o.status!==t.value){o.status=t.value;o.messages.push({from:"system",text:"Order status changed to "+t.value,at:Date.now()});commit();openOrder(o.id);toast("Order status: "+t.value+".")}}
 if(k==="stage"&&curOrder){var o3=order(curOrder);if(o3&&o3.stage!==t.value){o3.stage=t.value;o3.messages.push({from:"system",text:"Progress: "+t.value,at:Date.now()});commit();openOrder(o3.id);toast("Progress: "+t.value+".")}}
 if(k==="ofClient")ofClientHint();
 if(k==="ofType"){var p=$("#of-p");if(p&&p.dataset.auto==="1"&&$("#of-st").value!=="Quote"&&TYPE_PRICE[t.value]!=null)p.value=TYPE_PRICE[t.value]}
 if(k==="ofStatus"){var p2=$("#of-p");if(p2){if(t.value==="Quote"&&p2.dataset.auto==="1")p2.value="";else if(t.value!=="Quote"&&p2.value===""&&TYPE_PRICE[$("#of-t").value]!=null){p2.value=TYPE_PRICE[$("#of-t").value];p2.dataset.auto="1"}}}
 if(t.id==="fileOrder"&&curOrder){var o2=order(curOrder),fs=Array.prototype.slice.call(t.files);t.value="";Promise.all(fs.map(function(f){return compress(f,1000)})).then(function(r){r.forEach(function(d){o2.photos.push(d)});if(commit())openOrder(o2.id);else{o2.photos.length-=r.length}}).catch(function(){toast("Couldn't read that image.","err")})}
 if(t.id==="fileQuote"){var fq=Array.prototype.slice.call(t.files).slice(0,3-quoteFiles.length);t.value="";Promise.all(fq.map(function(f){return compress(f,900)})).then(function(r){quoteFiles=quoteFiles.concat(r);$("#qthumbs").innerHTML=quoteFiles.map(function(p){return '<img src="'+p+'" alt="">'}).join("")})}
 if(t.id==="fileImport"&&t.files.length){readFiles(t.files);}
 if(t.id==="fileRestore"&&t.files[0]){var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);if(d.v!==2||!d.users||!d.orders)throw 0;if(!confirm("Replace ALL current portal data with this backup?"))return;db=d;save();var mm=user(me.id);if(!mm){me=null;try{ls().removeItem(SKEY)}catch(x){}}else me=mm;render();toast("Backup restored.")}catch(x){toast("That file isn't a valid backup from this version of the portal.","err")}};rd.readAsText(t.files[0]);t.value=""}
});
document.addEventListener("input",function(e){
 var t=e.target,k=t.getAttribute&&t.getAttribute("data-input");
 if(k==="ofilter")applyOrderFilter(true);if(k==="cfilter")applyClientFilter();if(k==="est")estUpdate();
 if(t.id==="of-p")t.dataset.auto="";
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){if($("#lb").classList.contains("open"))$("#lb").classList.remove("open");else if($("#modal").classList.contains("open"))closeModal()}});
function qvalid(){if(!$("#q-s").value||!$("#q-q").value||!$("#q-t").value.trim()){toast("Please fill in service, quantity and project details.","err");return false}return true}
function qbody(){return "Hello Gonzales Embroidery,\n\nI'd like a quote.\n\nName: "+me.name+" ("+custId(me)+")\nContact: "+(me.phone||me.email)+"\nService: "+$("#q-s").value+"\nQuantity: "+$("#q-q").value+($("#q-d").value?"\nNeeded by: "+$("#q-d").value:"")+"\n\nProject details:\n"+$("#q-t").value.trim()+"\n"}

db=load();
try{var sid=ls().getItem(SKEY);if(sid){var su=user(sid);if(su&&su.hash)me=su}}catch(e){}
try{if(!ls().getItem(KEY))save()}catch(e){}
render();
window.__portalTest={sha256:sha256,toISO:toISO,normStat:normStat,normType:normType,parseSheet:parseSheet,summary:summary,custId:custId,get db(){return db}};
})();
